[project]
name = "neuroarena"
version = "0.0.0"
description = "Decoupled car-driving game and learning-model training platform"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "arcade>=3.0", "neat-python>=0.92,<1.0", "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12"]

[project.scripts]
neuroarena-play = "neuroarena.render.play:main"
neuroarena-track-gen = "neuroarena.tracks.cli:main"
neuroarena-train = "neuroarena.persistence.cli:main"
neuroarena-dashboard = "neuroarena.dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroarena"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "neat.*"
ignore_missing_imports = true
